<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="/admin/icon.svg">
<title>Chatbot Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; }
  #login { max-width: 380px; margin: 100px auto; background: #fff; padding: 36px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
  #login h1 { margin-bottom: 6px; } #login p { color: #6b7280; margin-bottom: 20px; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; font-family: inherit; }
  button { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:hover { background: #4338ca; }
  button.ghost { background: #e5e7eb; color: #374151; }
  button.danger { background: #dc2626; }
  button.small { padding: 6px 12px; font-size: 13px; }
  #app { display: none; }
  header.app { background: #1f2937; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
  header.app .brand { font-weight: 700; font-size: 18px; }
  header.app .who { font-size: 13px; color: #9ca3af; }
  nav.tabs { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 28px; display: flex; gap: 4px; }
  nav.tabs button { background: none; color: #4b5563; border-radius: 0; padding: 14px 18px; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }
  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  .tab { display: none; } .tab.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .n { font-size: 32px; font-weight: 800; } .stat .l { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .panel { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .panel h3 { margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.faq { background: #e0e7ff; color: #3730a3; } .pill.llm { background: #d1fae5; color: #065f46; }
  .pill.fallback { background: #fee2e2; color: #991b1b; } .pill.order { background: #fef3c7; color: #92400e; }
  .pill.capture { background: #ede9fe; color: #5b21b6; } .pill.smalltalk { background: #f3f4f6; color: #4b5563; }
  .pill.lead { background: #dbeafe; color: #1e40af; } .pill.callback { background: #fce7f3; color: #9d174d; }
  .row-actions { display: flex; gap: 6px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal .box { background: #fff; border-radius: 14px; padding: 28px; width: 640px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
  .transcript .u { text-align: right; margin: 8px 0; } .transcript .a { text-align: left; margin: 8px 0; }
  .transcript .u span { background: #4f46e5; color: #fff; padding: 8px 14px; border-radius: 14px; display: inline-block; max-width: 80%; }
  .transcript .a span { background: #f3f4f6; padding: 8px 14px; border-radius: 14px; display: inline-block; max-width: 80%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .err { color: #dc2626; font-size: 14px; margin-bottom: 12px; }
  .ok { color: #059669; font-size: 14px; margin-bottom: 12px; }
  label.lbl { font-size: 13px; font-weight: 600; color: #4b5563; display: block; margin-bottom: 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
  .check input { width: auto; margin: 0; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  /* ---------- mobile: agents can run the inbox from a phone ---------- */
  @media (max-width: 720px) {
    body { font-size: 15px; }
    header.app { flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    nav.tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; display: flex; }
    nav.tabs button { flex: 0 0 auto; padding: 10px 14px; font-size: 14px; }
    .tab { padding: 14px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .modal .box { width: 100%; border-radius: 0; max-height: 100vh; height: 100%; }
    input, select, textarea, button { font-size: 16px; } /* no iOS zoom-on-focus */
    #login { margin: 24px 14px; padding: 28px 20px; }
  }
</style>
</head>
<body>

<div id="login">
  <h1>🤖 Chatbot Admin</h1>
  <p>Sign in to manage your business's chatbot.</p>
  <div class="err" id="login-err" style="display:none"></div>
  <input id="username" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <div id="login-captcha-slot" style="margin:10px 0"></div>
  <button onclick="doLogin()" style="width:100%">Sign in</button>
</div>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>

<div id="app">
  <header class="app">
    <div class="brand">🤖 <span id="biz-name">Chatbot</span> Admin</div>
    <div class="who"><span id="who"></span> &nbsp;<button class="small ghost" onclick="doLogout()">Sign out</button></div>
  </header>
  <div id="trial-banner" style="display:none"></div>
  <nav class="tabs">
    <button class="active" data-tab="overview" onclick="showTab('overview')">Overview</button>
    <button data-tab="faqs" onclick="showTab('faqs')">Knowledge Base</button>
    <button data-tab="leads" onclick="showTab('leads')">Leads</button>
    <button data-tab="convs" onclick="showTab('convs')">Conversations</button>
    <button data-tab="orders" onclick="showTab('orders')">Orders</button>
    <button data-tab="nudges" onclick="showTab('nudges')">Nudges</button>
    <button data-tab="qalab" onclick="showTab('qalab')">QA Lab</button>
    <button data-tab="abtests" onclick="showTab('abtests')">A/B Tests</button>
    <button data-tab="articles" onclick="showTab('articles')">Articles</button>
    <button data-tab="actions" onclick="showTab('actions')">Actions</button>
    <button data-tab="settings" onclick="showTab('settings')">Settings</button>
  </nav>
  <main>
    <div class="tab active" id="tab-overview"></div>
    <div class="tab" id="tab-faqs"></div>
    <div class="tab" id="tab-leads"></div>
    <div class="tab" id="tab-convs"></div>
    <div class="tab" id="tab-orders"></div>
    <div class="tab" id="tab-nudges"></div>
    <div class="tab" id="tab-qalab"></div>
    <div class="tab" id="tab-abtests"></div>
    <div class="tab" id="tab-articles"></div>
    <div class="tab" id="tab-actions"></div>
    <div class="tab" id="tab-settings"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
var API = '';
function req(method, url, body) {
  return fetch(API + url, {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  }).then(function (r) {
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    return r.json().then(function (j) { return { status: r.status, json: j }; });
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts) { var d = new Date(ts); return d.toLocaleString(); }

function showLogin() { document.getElementById('login').style.display = 'block'; document.getElementById('app').style.display = 'none'; }
function showApp(me) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = me.username + ' · ' + me.business.name;
  document.getElementById('biz-name').textContent = me.business.name;
  window.__bizId = me.business && me.business.id ? me.business.id : '';
  loadAccountBanner();
  loadOverview();
}

/* ---------- Trial / plan banner ---------- */
function loadAccountBanner() {
  req('GET', '/api/admin/account').then(function (r) {
    var a = r.json, bar = document.getElementById('trial-banner');
    if (!a.trial) { bar.style.display = 'none'; return; }
    var days = a.trial_days_left;
    var plan = a.plan === 'trial' ? (a.trial_plan || 'starter') : a.plan;
    var upUrl = a.billing_configured
      ? '/api/billing/checkout?plan=' + encodeURIComponent(plan) + '&business_name=' + encodeURIComponent(a.business_name) + '&admin_username=trial-upgrade&business_id=' + encodeURIComponent(me_business_id())
      : '/pricing/';
    bar.style.display = 'block';
    bar.innerHTML = '<div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'
      + '<span>⏳ <strong>Free trial:</strong> ' + days + ' day' + (days === 1 ? '' : 's') + ' left. Upgrade to keep your chatbot running.</span>'
      + '<a href="' + upUrl + '" style="background:#fff;color:#4f46e5;font-weight:700;padding:8px 18px;border-radius:8px;text-decoration:none">Upgrade now →</a></div>';
  }).catch(function () {});
}
function me_business_id() { return window.__bizId || ''; }

function doLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  var e = document.getElementById('login-err');
  e.style.display = 'none';
  var cap = document.querySelector('#login [name="h-captcha-response"]');
  // NOTE: don't use req() here — it throws on 401 before we can show the error.
  fetch(API + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p, captcha_token: cap ? cap.value : '' }),}).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, json: j }; });}).then(function (r) {
    if (r.status === 429) { e.style.display = 'block'; e.textContent = 'Too many attempts — wait a minute and try again.'; return; }
    if (r.status !== 200) { e.style.display = 'block'; e.textContent = (r.json && r.json.error) || 'Login failed'; return; }
    req('GET', '/api/auth/me').then(function (m) { showApp(m.json); }).catch(function () {});}).catch(function () {
    e.style.display = 'block'; e.textContent = 'Could not reach the server. Check your connection and try again.';});
}
function doLogout() { req('POST', '/api/auth/logout').then(showLogin); }
document.getElementById('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
// Render hCaptcha on the login form only when the server has it configured.
(function () {
  fetch(API + '/api/public-config').then(function (r) { return r.json(); }).then(function (c) {
    if (c && c.captcha_sitekey) {
      var d = document.createElement('div');
      d.className = 'h-captcha'; d.setAttribute('data-sitekey', c.captcha_sitekey);
      document.getElementById('login-captcha-slot').appendChild(d);
    }
  }).catch(function () {});
})();

function showTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  ({ overview: loadOverview, faqs: loadFaqs, leads: loadLeads, convs: loadConvs, orders: loadOrders, nudges: loadNudges, qalab: loadQaLab, abtests: loadAbTests, articles: loadArticles, actions: loadActions, settings: loadSettings })[name]();
}

/* ---------- Overview ---------- */
function loadOverview() {
  req('GET', '/api/admin/analytics').then(function (r) {
    var a = r.json;
    var maxChats = Math.max.apply(null, [1].concat(a.chats_per_day.map(function (d) { return d.chats; })));
    var bars = a.chats_per_day.map(function (d) {
      return '<div style="flex:1;text-align:center"><div style="height:' + Math.round(d.chats / maxChats * 120) + 'px;background:#4f46e5;border-radius:4px 4px 0 0"></div><div style="font-size:11px;color:#6b7280;margin-top:4px">' + esc(d.day.slice(5)) + '<br><strong>' + d.chats + '</strong></div></div>';
    }).join('');
    var unans = a.top_unanswered.length ? a.top_unanswered.map(function (u) {
      return '<tr><td>' + esc(u.question) + '</td><td>' + u.times + '×</td><td style="color:#6b7280">' + timeAgo(u.last_seen) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" style="color:#6b7280">No unanswered questions — nice!</td></tr>';
    // --- CSAT (thumbs up/down on bot replies) ---
    var csat = a.csat || { positive: 0, negative: 0, percent: null, per_day: [] };
    var csatCard = csat.percent == null ? '—' : csat.percent + '%';
    var maxVotes = Math.max.apply(null, [1].concat(csat.per_day.map(function (d) { return d.positive + d.negative; })));
    var csatBars = csat.per_day.length ? csat.per_day.map(function (d) {
      var tot = d.positive + d.negative;
      var ph = Math.round(d.positive / maxVotes * 120), nh = Math.round(d.negative / maxVotes * 120);
      return '<div style="flex:1;text-align:center"><div style="display:flex;flex-direction:column;justify-content:flex-end;height:120px;align-items:center"><div style="width:60%;height:' + ph + 'px;background:#10b981;border-radius:4px 4px 0 0"></div><div style="width:60%;height:' + nh + 'px;background:#ef4444;border-radius:0 0 4px 4px"></div></div><div style="font-size:11px;color:#6b7280;margin-top:4px">' + esc(d.day.slice(5)) + '<br><strong>' + tot + '</strong></div></div>';
    }).join('') : '<p style="color:#6b7280;font-size:14px">No votes yet — visitors can rate each bot reply with 👍 / 👎.</p>';
    // --- Resolution funnel ---
    var f = a.funnel || { answered: 0, escalated: 0, leads: 0 };
    document.getElementById('tab-overview').innerHTML =
      '<div class="cards">' +
      '<div class="stat"><div class="n">' + a.resolution.total + '</div><div class="l">Chats (30 days)</div></div>' +
      '<div class="stat"><div class="n">' + a.resolution.resolution_rate + '%</div><div class="l">Est. resolution rate</div></div>' +
      '<div class="stat"><div class="n">' + a.leads_30d + '</div><div class="l">Leads captured (30 days)</div></div>' +
      '<div class="stat"><div class="n">' + csatCard + '</div><div class="l">CSAT — thumbs positive (14 days)<br><span style="font-size:12px">👍 ' + csat.positive + ' · 👎 ' + csat.negative + '</span></div></div>' +
      '</div>' +
      '<div class="panel"><h3>Chats per day (14 days)</h3><div style="display:flex;gap:6px;align-items:flex-end">' + bars + '</div></div>' +
      '<div class="panel"><h3>Resolution funnel (30 days)</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">What happened to each session: answered directly by the bot, escalated to a human, or turned into a captured lead.</p>' +
      '<table><tr><th>Stage</th><th>Sessions</th></tr>' +
      '<tr><td>✅ Answered by the bot</td><td><strong>' + f.answered + '</strong></td></tr>' +
      '<tr><td>🙋 Escalated to a human</td><td><strong>' + f.escalated + '</strong></td></tr>' +
      '<tr><td>📥 Leads captured</td><td><strong>' + f.leads + '</strong></td></tr></table></div>' +
      '<div class="panel"><h3>CSAT trend (14 days)</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Thumbs ratings on bot replies — green = helpful, red = not helpful.</p><div style="display:flex;gap:6px;align-items:flex-end">' + csatBars + '</div></div>' +
      '<div class="panel"><h3>Top unanswered questions</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Questions the bot couldn\'t answer — add these to the Knowledge Base to improve it.</p><table><tr><th>Question</th><th>Times asked</th><th>Last seen</th></tr>' + unans + '</table></div>';
  });
}

/* ---------- FAQs ---------- */
function loadFaqs() {
  req('GET', '/api/admin/faqs').then(function (r) {
    var rows = r.json.map(function (f) {
      return '<tr><td><strong>' + esc(f.question) + '</strong><br><span style="color:#4b5563">' + esc(f.answer).slice(0, 120) + (f.answer.length > 120 ? '…' : '') + '</span><br><span style="color:#9ca3af;font-size:12px">keywords: ' + esc(f.keywords) + '</span></td>' +
        '<td><div class="row-actions"><button class="small ghost" onclick="editFaq(' + f.id + ')">Edit</button><button class="small danger" onclick="delFaq(' + f.id + ')">Delete</button></div></td></tr>';
    }).join('');
    document.getElementById('tab-faqs').innerHTML =
      '<div class="panel"><h3>Import from website</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Crawls a website (same domain only) and adds its pages to the knowledge base. Runs in the background — you can keep working; new documents appear below automatically.</p>' +
      '<div class="grid2"><div><label class="lbl">Website URL</label><input id="crawl-url" placeholder="https://example.com"></div>' +
      '<div><label class="lbl">Max pages</label><input id="crawl-max" type="number" value="20" min="1" max="100"></div></div>' +
      '<button onclick="startCrawl()">Start crawl</button> <span class="ok" id="crawl-ok" style="display:none"></span></div>' +
      '<div class="panel"><h3>Crawled documents</h3><div id="doc-list"><p style="color:#6b7280">Loading…</p></div></div>' +
      '<div class="panel"><h3>Knowledge base <span style="color:#6b7280;font-weight:400;font-size:13px">(' + r.json.length + ' entries)</span></h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">The bot matches visitor questions against these using TF-IDF similarity. Add keywords (comma-separated synonyms) to improve matching.</p>' +
      '<button onclick="editFaq(null)">+ Add FAQ</button></div>' +
      '<div class="panel"><table><tr><th>Question / Answer</th><th style="width:150px">Actions</th></tr>' + (rows || '<tr><td colspan="2" style="color:#6b7280">No FAQs yet — add your first one above.</td></tr>') + '</table></div>';
    window._faqs = r.json;
    loadDocuments();
    maybePollDocuments();
  });
}
/* ---------- Crawled documents ---------- */
function startCrawl() {
  var url = document.getElementById('crawl-url').value.trim();
  var max = parseInt(document.getElementById('crawl-max').value, 10) || 20;
  if (!url) { alert('Enter a website URL.'); return; }
  req('POST', '/api/admin/crawl', { url: url, max_pages: max }).then(function (r) {
    var ok = document.getElementById('crawl-ok');
    if (r.status >= 400 || !r.json.started) { alert(r.json.error || 'Crawl failed to start'); return; }
    ok.style.display = 'inline';
    ok.textContent = 'Crawl started — documents will appear below as they are imported.';
    window._crawlStartedAt = Date.now();
    maybePollDocuments();
    setTimeout(function () { ok.style.display = 'none'; }, 8000);
  });
}
function loadDocuments() {
  var box = document.getElementById('doc-list');
  if (!box) return;
  req('GET', '/api/admin/documents').then(function (r) {
    var docs = r.json || [];
    if (!docs.length) { box.innerHTML = '<p style="color:#6b7280">No crawled documents yet — import a website above.</p>'; return; }
    // Group by source URL for a compact list.
    var groups = {};
    docs.forEach(function (d) {
      var g = groups[d.source_url] || (groups[d.source_url] = { url: d.source_url, title: d.title, ids: [], qa: 0, chunks: 0 });
      g.ids.push(d.id);
      if (d.question) g.qa++; else g.chunks++;
    });
    var rows = Object.keys(groups).map(function (u) {
      var g = groups[u];
      var what = g.qa ? (g.qa + ' Q/A pair' + (g.qa === 1 ? '' : 's')) : (g.chunks + ' chunk' + (g.chunks === 1 ? '' : 's'));
      return '<tr><td><strong>' + esc(g.title || g.url) + '</strong><br><span style="color:#6b7280;font-size:12px">' + esc(g.url) + '</span><br><span style="color:#9ca3af;font-size:12px">' + what + '</span></td>' +
        '<td style="width:120px"><button class="small danger" onclick="delDocGroup(' + JSON.stringify(g.ids) + ')">Delete</button></td></tr>';
    }).join('');
    box.innerHTML = '<table><tr><th>Source</th><th style="width:120px"></th></tr>' + rows + '</table>';
  }).catch(function () { box.innerHTML = '<p class="err">Could not load documents.</p>'; });
}
function delDocGroup(ids) {
  if (!confirm('Delete these ' + ids.length + ' imported document(s)?')) return;
  (function next(i) {
    if (i >= ids.length) { loadDocuments(); return; }
    req('DELETE', '/api/admin/documents/' + ids[i]).then(function () { next(i + 1); });
  })(0);
}
// While a crawl started in the last 2 minutes, refresh the documents list every 5s.
function maybePollDocuments() {
  if (window._docPoll) return;
  window._docPoll = setInterval(function () {
    if (!window._crawlStartedAt || Date.now() - window._crawlStartedAt > 120000) {
      clearInterval(window._docPoll); window._docPoll = null; return;
    }
    if (document.getElementById('doc-list')) loadDocuments();
  }, 5000);
}
function editFaq(id) {
  var f = id ? window._faqs.find(function (x) { return x.id === id; }) : { question: '', answer: '', keywords: '' };
  openModal('<h3>' + (id ? 'Edit' : 'Add') + ' FAQ</h3>' +
    '<label class="lbl">Question</label><input id="f-q" value="' + esc(f.question).replace(/"/g, '&quot;') + '">' +
    '<label class="lbl">Answer</label><textarea id="f-a" rows="5">' + esc(f.answer) + '</textarea>' +
    '<label class="lbl">Keywords (optional, comma-separated)</label><input id="f-k" value="' + esc(f.keywords).replace(/"/g, '&quot;') + '">' +
    '<div class="row-actions"><button onclick="saveFaq(' + (id || 'null') + ')">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div><div class="ok" id="f-ok" style="display:none;margin-top:12px"></div>');
}
function saveFaq(id) {
  var body = { question: document.getElementById('f-q').value.trim(), answer: document.getElementById('f-a').value.trim(), keywords: document.getElementById('f-k').value.trim() };
  if (!body.question || !body.answer) { alert('Question and answer are required.'); return; }
  req(id ? 'PUT' : 'POST', id ? '/api/admin/faqs/' + id : '/api/admin/faqs', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    closeModal(); loadFaqs();
  });
}
function delFaq(id) {
  if (!confirm('Delete this FAQ?')) return;
  req('DELETE', '/api/admin/faqs/' + id).then(loadFaqs);
}

/* ---------- Leads ---------- */
function loadLeads() {
  req('GET', '/api/admin/leads').then(function (r) {
    var rows = r.json.map(function (l) {
      return '<tr><td><strong>' + esc(l.name) + '</strong></td><td>' + esc(l.email) + '<br><span style="color:#6b7280">' + esc(l.phone) + '</span></td>' +

  });
}

/* ---------- Conversations (live-agent inbox) ---------- */
var convsTimer = null;
function loadConvs() {
  req('GET', '/api/admin/sessions?flagged=1').then(function (fr) {
    req('GET', '/api/admin/sessions').then(function (r) {
      function statusPill(s) {
        if (s.human_active) return '<span class="pill lead">agent live</span>';
        if (s.flagged_human) return '<span class="pill fallback">needs human</span>';
        if (s.resolved) return '<span class="pill llm">resolved</span>';
        return '<span class="pill smalltalk">open</span>';
      }
      function row(s) {
        var unread = s.unread_admin ? ' <span class="pill callback">new</span>' : '';
        var idCell = s.unread_admin
          ? '<td style="font-family:monospace;font-size:12px"><strong>' + esc(s.id.slice(0, 14)) + '…</strong></td>'
          : '<td style="font-family:monospace;font-size:12px">' + esc(s.id.slice(0, 14)) + '…</td>';
        return '<tr>' + idCell +
          '<td style="color:#6b7280;white-space:nowrap">' + timeAgo(s.created_at) + '</td>' +
          '<td>' + (s.channel && s.channel !== 'web' ? '<span class="pill order">' + esc(s.channel) + '</span> ' : '') +
          statusPill(s) + unread + '</td>' +
          '<td><div class="row-actions"><button class="small ghost" onclick="viewSession(\'' + s.id + '\')">Open inbox</button>' +
          (s.flagged_human && !s.human_active ? '<button class="small" onclick="takeoverSession(\'' + s.id + '\')">Take over</button>' : '') +
          (s.human_active ? '<button class="small ghost" onclick="handbackSession(\'' + s.id + '\')">Hand back to bot</button>' : '') +
          ((s.flagged_human || s.human_active) ? '<button class="small ghost" onclick="resolveSession(\'' + s.id + '\')">Resolve</button>' : '') +
          '</div></td></tr>';
      }
      var flagged = fr.json.map(row).join('');
      var live = r.json.filter(function (s) { return s.human_active && !s.flagged_human; }).map(row).join('');
      var all = r.json.map(row).join('');
      // Tab badge: needs-human count in the document title.
      var needCount = fr.json.filter(function (s) { return !s.human_active; }).length;
      document.title = (needCount ? '(' + needCount + ') ' : '') + 'Chatbot Admin';
      document.getElementById('tab-convs').innerHTML =
        '<div class="panel"><h3>⚑ Needs human follow-up (' + fr.json.length + ')</h3><table><tr><th>Session</th><th>Started</th><th>Status</th><th></th></tr>' + (flagged || '<tr><td colspan="4" style="color:#6b7280">Nothing flagged. Visitors who ask for a human appear here.</td></tr>') + '</table></div>' +
        (live ? '<div class="panel"><h3>🟢 Agent live (' + r.json.filter(function (s) { return s.human_active && !s.flagged_human; }).length + ')</h3><table><tr><th>Session</th><th>Started</th><th>Status</th><th></th></tr>' + live + '</table></div>' : '') +
        '<div class="panel"><h3>All conversations (' + r.json.length + ')</h3><table><tr><th>Session</th><th>Started</th><th>Status</th><th></th></tr>' + (all || '<tr><td colspan="4" style="color:#6b7280">No conversations yet.</td></tr>') + '</table></div>';
      // Auto-refresh the inbox every 15s while this tab is visible and no modal is open.
      if (convsTimer) clearInterval(convsTimer);
      convsTimer = setInterval(function () {
        var tabActive = document.getElementById('tab-convs').classList.contains('active');
        var modalOpen = document.getElementById('modal').classList.contains('open');
        if (tabActive && !modalOpen) loadConvs();
      }, 15000);
    });
  });
}
function viewSession(id) {
  req('GET', '/api/admin/sessions/' + id).then(function (r) {
    var s = r.json.session;
    var msgs = r.json.messages.map(function (m) {
      var meta = {};
      try { meta = JSON.parse(m.meta || '{}'); } catch (e) {}
      var cls = m.role === 'user' ? 'u' : 'a';
      var tag = m.role === 'assistant' && meta.type ? ' <span class="pill ' + esc(meta.type) + '">' + esc(meta.type) + (meta.confidence ? ' ' + meta.confidence : '') + '</span>' : '';
      if (meta.type === 'admin_reply') tag = ' <span class="pill lead">agent</span>';
      return '<div class="' + cls + '"><span>' + esc(m.text) + '</span>' + tag + '</div>';
    }).join('');
    var chBadge = s.channel && s.channel !== 'web' ? ' <span class="pill order">' + esc(s.channel) + '</span>' : '';
    var handoff = s.handoff_summary
      ? '<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;white-space:pre-wrap"><strong>📋 Handoff context</strong><br>' + esc(s.handoff_summary) + '</div>'
      : '';
    var stateBtns = s.human_active
      ? '<button class="ghost" onclick="handbackSession(\'' + id + '\',true)">Hand back to bot</button>'
      : '<button onclick="takeoverSession(\'' + id + '\',true)">Take over</button>';
    openModal('<h3>Conversation' + chBadge + (s.human_active ? ' <span class="pill lead">agent live</span>' : '') + '</h3>' + handoff +
      '<div class="transcript">' + msgs + '</div>' +
      '<label class="lbl" style="margin-top:12px">Reply as the team</label><textarea id="reply-text" rows="2" maxlength="2000" placeholder="Type a reply… (sends via WhatsApp/Messenger when connected, otherwise as a widget nudge)"></textarea>' +
      '<div class="row-actions" style="margin-top:8px"><button onclick="sendReply(\'' + id + '\')">Send reply</button>' + stateBtns +
      '<button class="ghost" onclick="resolveSession(\'' + id + '\',true)">Resolve</button><button class="ghost" onclick="closeModal()">Close</button></div>');
  });
}
function sendReply(id) {
  var text = document.getElementById('reply-text').value.trim();
  if (!text) { alert('Enter a message first.'); return; }
  req('POST', '/api/admin/sessions/' + id + '/reply', { text: text }).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Failed to send'); return; }
    closeModal();
    viewSession(id);
    loadConvs();
  });
}
function takeoverSession(id, fromModal) {
  req('POST', '/api/admin/sessions/' + id + '/takeover').then(function () {
    if (fromModal) { viewSession(id); } loadConvs();
  });
}
function handbackSession(id, fromModal) {
  req('POST', '/api/admin/sessions/' + id + '/handback').then(function () {
    if (fromModal) { viewSession(id); } loadConvs();
  });
}
function resolveSession(id, fromModal) {
  req('POST', '/api/admin/sessions/' + id + '/resolve').then(function () {
    if (fromModal) closeModal(); loadConvs();
  });
}

/* ---------- Orders ---------- */
function loadOrders() {

      '<button onclick="editOrder(null)">+ Add order</button></div>' +
      '<div class="panel"><table><tr><th>Order #</th><th>Status</th><th>ETA</th><th>Carrier / Tracking</th><th>Items</th><th></th></tr>' + (rows || '<tr><td colspan="6" style="color:#6b7280">No orders.</td></tr>') + '</table></div>';
    window._orders = r.json;
  });

function editOrder(id) {
  var o = id ? window._orders.find(function (x) { return x.id === id; }) : { order_number: '', status: '', eta: '', carrier: '', tracking_number: '', items: '' };
  openModal('<h3>' + (id ? 'Edit' : 'Add') + ' order</h3>' +
    ['order_number|Order number', 'status|Status', 'eta|ETA', 'carrier|Carrier', 'tracking_number|Tracking number', 'items|Items'].map(function (f) {
      var k = f.split('|')[0], l = f.split('|')[1];
      return '<label class="lbl">' + l + '</label><input id="o-' + k + '" value="' + esc(o[k]).replace(/"/g, '&quot;') + '">';
    }).join('') +
    '<div class="row-actions"><button onclick="saveOrder()">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div>');
}
function saveOrder() {
  var body = {};
  ['order_number', 'status', 'eta', 'carrier', 'tracking_number', 'items'].forEach(function (k) { body[k] = document.getElementById('o-' + k).value.trim(); });
  if (!body.order_number || !body.status) { alert('Order number and status are required.'); return; }
  req('POST', '/api/admin/orders', body).then(function () { closeModal(); loadOrders(); });
}
function delOrder(id) { if (confirm('Delete this order?')) req('DELETE', '/api/admin/orders/' + id).then(loadOrders); }

/* ---------- Nudges (proactive messaging) ---------- */

          '<td>' + (n.shown ? '<span class="pill llm">shown</span>' : '<span class="pill order">pending</span>') + '</td>' +

        '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Message visitors who chatted in the last 15 minutes, or pick one conversation. The nudge appears in their widget as a note from your team.</p>' +
        '<label class="lbl">Message (max 500 chars)</label><textarea id="nudge-text" rows="3" maxlength="500" placeholder="Hi! Need any help finding something today?"></textarea>' +

function sendNudge() {
  var text = document.getElementById('nudge-text').value.trim();
  var target = document.getElementById('nudge-target').value;
  if (!text) { alert('Enter a message first.'); return; }

    var ok = document.getElementById('nudge-ok');

/* ---------- QA Lab (bot testing playground) ---------- */
function loadQaLab() {
  req('GET', '/api/admin/qa/runs').then(function (r) {
    var runs = r.json || [];
    var rows = runs.map(function (run) {
      var passed = 0, total = 0;
      try { var res = JSON.parse(run.results || '[]'); total = res.length; passed = res.filter(function (x) { return x.pass; }).length; } catch (e) {}
      return '<tr><td><strong>' + esc(run.name || 'Untitled run') + '</strong></td>' +
        '<td>' + (total ? passed + '/' + total + ' passed' : '—') + '</td>' +
        '<td style="color:#6b7280;white-space:nowrap">' + timeAgo(run.created_at) + '</td>' +
        '<td style="white-space:nowrap"><button class="small" onclick="viewQaRun(' + run.id + ')">View</button> ' +
        '<button class="small" onclick="rerunQa(' + run.id + ')">Re-run</button> ' +
        '<button class="small ghost" onclick="delQaRun(' + run.id + ')">Delete</button></td></tr>';
    }).join('');
    document.getElementById('tab-qalab').innerHTML =
      '<div class="panel"><h3>Run a scripted test conversation</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Test the real bot without polluting analytics — test chats never create tickets or fire webhooks. One step per line: <code>your message | text you expect in the reply</code> (the part after | is optional).</p>' +
      '<label class="lbl">Test name</label><input id="qa-name" placeholder="e.g. Refund flow happy path">' +
      '<label class="lbl">Script steps (1–30 lines)</label><textarea id="qa-script" rows="5" placeholder="hi | hello\nwhat is your return policy | 30 days\nI want a refund for order ORD-1234"></textarea>' +
      '<button onclick="runQa()">Run test</button> <span class="ok" id="qa-ok" style="display:none"></span></div>' +
      '<div class="panel" id="qa-result" style="display:none"></div>' +
      '<div class="panel"><h3>Saved runs</h3><table><tr><th>Name</th><th>Result</th><th>Ran</th><th></th></tr>' +
      (rows || '<tr><td colspan="4" style="color:#6b7280">No test runs yet.</td></tr>') + '</table></div>';
  });
}
function parseQaScript() {
  return document.getElementById('qa-script').value.split('\n').map(function (line) {
    var parts = line.split('|');
    var message = (parts[0] || '').trim();
    if (!message) return null;
    return { message: message, expect_contains: (parts[1] || '').trim() };
  }).filter(Boolean);
}
function runQa() {
  var script = parseQaScript();
  if (!script.length) { alert('Add at least one script step.'); return; }
  var ok = document.getElementById('qa-ok');
  ok.style.display = 'inline'; ok.textContent = 'Running…';
  req('POST', '/api/admin/qa/run', { name: document.getElementById('qa-name').value.trim(), script: script }).then(function (r) {
    ok.style.display = 'none';
    if (r.status >= 400) { alert(r.json.error || 'QA run failed'); return; }
    showQaResult(r.json);
    loadQaLabList();
  });
}
function showQaResult(data) {
  var rows = (data.results || []).map(function (st, i) {
    return '<tr><td style="font-size:12px;color:#6b7280">' + (i + 1) + '</td>' +
      '<td>' + esc(st.message) + '</td><td>' + esc((st.reply || '').slice(0, 220)) + '</td>' +
      '<td>' + (st.pass ? '<span class="pill llm">pass</span>' : '<span class="pill order">fail</span>') + '</td></tr>';
  }).join('');
  var box = document.getElementById('qa-result');
  box.style.display = 'block';
  box.innerHTML = '<h3>Result: ' + data.passed + '/' + data.total + ' passed</h3>' +
    '<table><tr><th>#</th><th>You said</th><th>Bot replied</th><th></th></tr>' + rows + '</table>';
  box.scrollIntoView();
}
function loadQaLabList() { loadQaLab(); }
function viewQaRun(id) {
  req('GET', '/api/admin/qa/runs/' + id).then(function (r) {
    if (r.status >= 400) { alert('Not found'); return; }
    var run = r.json, results = [];
    try { results = JSON.parse(run.results || '[]'); } catch (e) {}
    showQaResult({ results: results, passed: results.filter(function (x) { return x.pass; }).length, total: results.length });
  });
}
function rerunQa(id) {
  req('POST', '/api/admin/qa/runs/' + id + '/rerun', {}).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Re-run failed'); return; }
    showQaResult(r.json);
    loadQaLab();
  });
}
function delQaRun(id) {
  if (!confirm('Delete this test run?')) return;
  req('DELETE', '/api/admin/qa/runs/' + id).then(function () { loadQaLab(); });
}

/* ---------- A/B tests (proactive nudge experiments) ---------- */
function loadAbTests() {
  req('GET', '/api/admin/ab-tests').then(function (r) {
    var tests = r.json || [];
    var rows = tests.map(function (t) {
      var running = t.status === 'running';
      return '<tr><td><strong>' + esc(t.name) + '</strong><br><span style="font-size:12px;color:#6b7280">' + esc(t.trigger) +
        ' · split ' + esc(t.split) + '% A</span></td>' +
        '<td>' + (running ? '<span class="pill llm">running</span>' : '<span class="pill order">paused</span>') + '</td>' +
        '<td style="color:#6b7280;white-space:nowrap">' + timeAgo(t.created_at) + '</td>' +
        '<td style="white-space:nowrap"><button class="small" onclick="abStats(' + t.id + ')">Stats</button> ' +
        '<button class="small ghost" onclick="abToggle(' + t.id + ',' + (running ? 0 : 1) + ')">' + (running ? 'Pause' : 'Resume') + '</button></td></tr>';
    }).join('');
    document.getElementById('tab-abtests').innerHTML =
      '<div class="panel"><h3>Create an A/B test</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Test two versions of a proactive nudge. Visitors are split 50/50 (or your split) and you can compare impressions and conversions.</p>' +
      '<label class="lbl">Test name</label><input id="ab-name" placeholder="e.g. Idle nudge wording">' +
      '<label class="lbl">Trigger</label><select id="ab-trigger"><option value="welcome">welcome — first visit</option><option value="idle_30s">idle_30s — 30s without chatting</option><option value="exit_intent">exit_intent — about to leave</option></select>' +
      '<label class="lbl">Variant A message</label><textarea id="ab-a" rows="2" maxlength="500" placeholder="Still there? How can I help?"></textarea>' +
      '<label class="lbl">Variant B message</label><textarea id="ab-b" rows="2" maxlength="500" placeholder="Need a hand? I can help you check out."></textarea>' +
      '<label class="lbl">Split % for variant A</label><input id="ab-split" type="number" min="1" max="99" value="50" style="max-width:120px">' +
      '<button onclick="createAb()">Create test</button></div>' +
      '<div class="panel" id="ab-stats" style="display:none"></div>' +
      '<div class="panel"><h3>Your tests</h3><table><tr><th>Test</th><th>Status</th><th>Created</th><th></th></tr>' +
      (rows || '<tr><td colspan="4" style="color:#6b7280">No A/B tests yet.</td></tr>') + '</table></div>';
  });
}
function createAb() {
  var body = {
    name: document.getElementById('ab-name').value.trim(),
    trigger: document.getElementById('ab-trigger').value,
    variant_a: document.getElementById('ab-a').value.trim(),
    variant_b: document.getElementById('ab-b').value.trim(),
    split: parseInt(document.getElementById('ab-split').value, 10) || 50,
  };
  if (!body.name || !body.variant_a || !body.variant_b) { alert('Fill in the name and both variants.'); return; }
  req('POST', '/api/admin/ab-tests', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Failed to create'); return; }
    loadAbTests();
  });
}
function abToggle(id, run) {
  req('PUT', '/api/admin/ab-tests/' + id, { status: run ? 'running' : 'paused' }).then(function () { loadAbTests(); });
}
function abStats(id) {
  req('GET', '/api/admin/ab-tests/' + id + '/stats').then(function (r) {
    var box = document.getElementById('ab-stats');
    box.style.display = 'block';
    if (r.status >= 400) { box.innerHTML = '<p style="color:#b91c1c">Stats unavailable.</p>'; return; }
    var st = r.json || {};
    function vrow(label, v) {
      v = v || {};
      var conv = v.impressions ? Math.round(100 * (v.conversions || 0) / v.impressions) : 0;
      return '<tr><td><strong>' + label + '</strong></td><td>' + (v.impressions || 0) + '</td><td>' + (v.conversions || 0) + '</td><td>' + conv + '%</td></tr>';
    }
    box.innerHTML = '<h3>Stats: ' + esc(st.name || ('Test #' + id)) + '</h3>' +
      '<table><tr><th>Variant</th><th>Impressions</th><th>Conversions</th><th>Conv. rate</th></tr>' +
      vrow('A', st.variant_a) + vrow('B', st.variant_b) + '</table>';
    box.scrollIntoView();
  });
}

/* ---------- Articles (help center) ---------- */
function loadArticles() {
  req('GET', '/api/admin/articles').then(function (r) {
    var arts = r.json || [];
    var rows = arts.map(function (a) {
      var pub = !!a.published;
      return '<tr><td><strong>' + esc(a.title) + '</strong></td>' +
        '<td>' + (pub ? '<span class="pill llm">published</span>' : '<span class="pill order">draft</span>') + '</td>' +
        '<td style="color:#6b7280;white-space:nowrap">' + timeAgo(a.updated_at || a.created_at) + '</td>' +
        '<td style="white-space:nowrap"><button class="small" onclick="editArticle(' + a.id + ')">Edit</button> ' +
        '<button class="small" onclick="pubArticle(' + a.id + ',' + (pub ? 0 : 1) + ')">' + (pub ? 'Unpublish' : 'Publish') + '</button> ' +
        '<button class="small ghost" onclick="delArticle(' + a.id + ')">Delete</button></td></tr>';
    }).join('');
    req('GET', '/api/admin/account').then(function (ar) {
      var biz = ((ar.json || {}).business_name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      document.getElementById('tab-articles').innerHTML =
        '<div class="panel"><h3>Help-center articles</h3>' +
        '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Published articles appear on your public help page' +
        (biz ? ' at <a href="/help/' + esc(biz) + '" target="_blank">/help/' + esc(biz) + '</a>' : '') + '.</p>' +
        '<button onclick="genArticles()">Generate from FAQs</button> ' +
        '<button class="ghost" onclick="newArticle()">New article</button> ' +
        '<span class="ok" id="art-ok" style="display:none"></span></div>' +
        '<div class="panel" id="art-editor" style="display:none"></div>' +
        '<div class="panel"><h3>All articles</h3><table><tr><th>Title</th><th>Status</th><th>Updated</th><th></th></tr>' +
        (rows || '<tr><td colspan="4" style="color:#6b7280">No articles yet — generate them from your FAQs.</td></tr>') + '</table></div>';
    });
  });
}
function genArticles() {
  var ok = document.getElementById('art-ok');
  ok.style.display = 'inline'; ok.textContent = 'Generating…';
  req('POST', '/api/admin/articles/generate', {}).then(function (r) {
    ok.style.display = 'none';
    if (r.status >= 400) { alert(r.json.error || 'Generation failed'); return; }
    loadArticles();
  });
}
function newArticle() {
  var box = document.getElementById('art-editor');
  box.style.display = 'block';
  box.innerHTML = '<h3>New article</h3>' +
    '<label class="lbl">Title</label><input id="art-title">' +
    '<label class="lbl">Body (markdown)</label><textarea id="art-body" rows="8"></textarea>' +
    '<button onclick="saveArticle(0)">Save draft</button> <button class="ghost" onclick="saveArticle(1)">Save &amp; publish</button>';
  box.scrollIntoView();
}
function editArticle(id) {
  req('GET', '/api/admin/articles/' + id).then(function (r) {
    if (r.status >= 400) { alert('Not found'); return; }
    var a = r.json;
    var box = document.getElementById('art-editor');
    box.style.display = 'block';
    box.innerHTML = '<h3>Edit article</h3>' +
      '<label class="lbl">Title</label><input id="art-title" value="' + esc(a.title) + '">' +
      '<label class="lbl">Body (markdown)</label><textarea id="art-body" rows="8">' + esc(a.body || '') + '</textarea>' +
      '<button onclick="saveArticle(' + (a.published ? 1 : 0) + ',' + id + ')">Save</button>';
    box.scrollIntoView();
  });
}
function saveArticle(publish, id) {
  var body = { title: document.getElementById('art-title').value.trim(), body: document.getElementById('art-body').value, published: !!publish };
  if (!body.title) { alert('Add a title first.'); return; }
  var done = function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    loadArticles();
  };
  if (id) req('PUT', '/api/admin/articles/' + id, body).then(done);
  else req('POST', '/api/admin/articles', body).then(done);
}
function pubArticle(id, publish) {
  req('PUT', '/api/admin/articles/' + id, { published: !!publish }).then(function () { loadArticles(); });
}
function delArticle(id) {
  if (!confirm('Delete this article?')) return;
  req('DELETE', '/api/admin/articles/' + id).then(function () { loadArticles(); });
}

/* ---------- Actions (agentic) ---------- */
function loadActions() {
  req('GET', '/api/admin/settings').then(function (sr) {
    var s = sr.json;
    var acts = s.actions || {};
    function tog(name, label, dflt) {
      var on = acts[name] !== undefined ? !!acts[name] : dflt;
      return '<div class="check"><input type="checkbox" id="a-' + name + '" ' + (on ? 'checked' : '') + '> ' + label + '</div>';
    }
    req('GET', '/api/admin/actions').then(function (ar) {
      var rows = (ar.json || []).map(function (a) {
        var args = {};
        try { args = JSON.parse(a.args || '{}'); } catch (e) {}
        var detail = esc(args.order_number || '') + (args.amount !== undefined ? ' · $' + esc(args.amount) : '');
        return '<tr><td><strong>' + esc(a.action) + '</strong></td><td style="font-family:monospace;font-size:12px">' + detail + '</td>' +
          '<td>' + esc(a.status) + '</td><td style="color:#6b7280;white-space:nowrap">' + timeAgo(a.created_at) + '</td></tr>';
      }).join('');
      document.getElementById('tab-actions').innerHTML =
        '<div class="panel"><h3>Agentic actions</h3>' +
        '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">When the AI brain is on, the bot can look up orders, cancel orders, issue refunds and escalate to a human. Cancel and refund always ask the visitor to confirm first; every execution is audit-logged below.</p>' +
        '<div class="check"><input type="checkbox" id="s-actions_enabled" ' + (s.actions_enabled !== false ? 'checked' : '') + '> Enable agentic actions</div>' +
        tog('get_order_status', 'Look up order status (read-only, runs immediately)', true) +
        tog('cancel_order', 'Cancel orders (visitor must confirm first)', true) +
        tog('issue_refund', 'Issue refunds (visitor must confirm first; auto-approves up to the limit below)', false) +
        tog('escalate_to_human', 'Escalate to a human', true) +
        '<label class="lbl">Refund auto-approve limit ($)</label><input id="s-refund_auto_approve_limit" value="' + esc(s.refund_auto_approve_limit !== undefined ? String(s.refund_auto_approve_limit) : '50') + '">' +
        '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Refunds above this amount are flagged for the team to approve instead of running automatically.</p>' +
        '<label class="lbl">Action webhook URL (optional)</label><input id="s-action_webhook_url" placeholder="https://your-crm.example.com/actions" value="' + esc(s.action_webhook_url || '').replace(/"/g, '&quot;') + '">' +
        '<label class="lbl">Action webhook secret</label><input id="s-action_webhook_secret" type="password" placeholder="(stored, never shown)" value="">' +
        '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">When set, actions are POSTed here as <code>{action, args, business_id, session_id}</code> with an <code>X-Action-Secret</code> header instead of running built-in. Secret status: <strong>' + (s.action_webhook_secret_set ? 'set' : 'not set') + '</strong>. Leave blank to keep the existing one.' + (s.llm_encryption_on ? '' : ' ⚠️ ENCRYPTION_KEY is not set — a new secret cannot be saved securely until it is.') + '</p>' +
        '<button onclick="saveActions()">Save actions</button> <span class="ok" id="a-ok" style="display:none">Saved ✓</span></div>' +
        '<div class="panel"><h3>Audit log</h3><table><tr><th>Action</th><th>Order</th><th>Status</th><th>Time</th></tr>' +
        (rows || '<tr><td colspan="4" style="color:#6b7280">No actions yet.</td></tr>') + '</table></div>';
    });
  });
}
function saveActions() {
  var body = {
    actions_enabled: document.getElementById('s-actions_enabled').checked,
    actions: {
      get_order_status: document.getElementById('a-get_order_status').checked,
      cancel_order: document.getElementById('a-cancel_order').checked,
      issue_refund: document.getElementById('a-issue_refund').checked,
      escalate_to_human: document.getElementById('a-escalate_to_human').checked,
    },
    refund_auto_approve_limit: document.getElementById('s-refund_auto_approve_limit').value,
    action_webhook_url: document.getElementById('s-action_webhook_url').value.trim(),
  };
  var k = document.getElementById('s-action_webhook_secret').value;
  if (k) body.action_webhook_secret = k;
  req('PUT', '/api/admin/settings', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    var ok = document.getElementById('a-ok'); ok.style.display = 'inline';
    setTimeout(function () { ok.style.display = 'none'; }, 2000);
    loadActions();
  });
}

/* ---------- Settings ---------- */
function loadSettings() {
  req('GET', '/api/admin/settings').then(function (r) {
    var s = r.json;
    document.getElementById('tab-settings').innerHTML =
      '<div class="panel"><h3>Business &amp; widget</h3>' +
      '<label class="lbl">Business name</label><input id="s-name" value="' + esc(s.name).replace(/"/g, '&quot;') + '">' +
      '<label class="lbl">Bot display name</label><input id="s-bot_name" value="' + esc(s.bot_name || '').replace(/"/g, '&quot;') + '">' +
      '<label class="lbl">Welcome message</label><textarea id="s-welcome_message" rows="3">' + esc(s.welcome_message || '') + '</textarea>' +
      '<div class="grid2"><div><label class="lbl">Brand color</label><input id="s-brand_color" value="' + esc(s.brand_color || '#4f46e5') + '"></div>' +
      '<div><label class="lbl">Support email</label><input id="s-support_email" value="' + esc(s.support_email || '').replace(/"/g, '&quot;') + '"></div></div>' +
      '<div class="check"><input type="checkbox" id="s-lead_capture_enabled" ' + (s.lead_capture_enabled !== false ? 'checked' : '') + '> Enable automatic lead capture when the bot can\'t answer</div>' +
      '<div class="grid2"><div><label class="lbl">Default language</label><select id="s-default_language">' +
      [['en', 'English'], ['es', 'Español'], ['fr', 'Français'], ['de', 'Deutsch'], ['pt', 'Português'], ['hi', 'हिन्दी'], ['ar', 'العربية']].map(function (l) {
        return '<option value="' + l[0] + '"' + ((s.default_language || 'en') === l[0] ? ' selected' : '') + '>' + l[1] + '</option>';
      }).join('') + '</select></div></div>' +
      '<div class="check"><input type="checkbox" id="s-auto_translate" ' + (s.auto_translate ? 'checked' : '') + '> Auto-translate replies to the visitor\'s language (needs LLM)</div>' +
      '<div class="check"><input type="checkbox" id="s-voice_enabled" ' + (s.voice_enabled !== false ? 'checked' : '') + '> Enable voice input/output in the widget (mic button + read-aloud toggle)</div>' +
      '<label class="lbl">Allowed origins (widget security)</label><textarea id="s-allowed_origins" rows="2" placeholder="https://shop.example.com, https://www.example.com">' + esc(s.allowed_origins || '') + '</textarea>' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Domains allowed to load the widget (comma or line separated). Supports <code>https://*.example.com</code>. Leave empty only for development.</p>' +
      '<button onclick="saveSettings()">Save settings</button> <span class="ok" id="s-ok" style="display:none">Saved ✓</span></div>' +
      '<div class="panel"><h3>Messaging channels</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Connect WhatsApp and Facebook Messenger. Paste the phone-number ID / page ID from your Meta app; the access tokens live as server env vars. Setup guide: README → “Messaging channels (Meta app setup)”.</p>' +
      '<div class="check"><input type="checkbox" id="s-whatsapp_enabled" ' + (s.whatsapp_enabled !== false ? 'checked' : '') + '> Enable WhatsApp</div>' +
      '<label class="lbl">WhatsApp phone number ID</label><input id="s-whatsapp_phone_number_id" placeholder="e.g. 123456789012345" value="' + esc(s.whatsapp_phone_number_id || '').replace(/"/g, '&quot;') + '">' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Token status: ' + (s.whatsapp_token_set ? 'configured ✓' : 'not set — add WHATSAPP_TOKEN on the server') + '. Inbound messages only route while enabled.</p>' +
      '<div class="check"><input type="checkbox" id="s-messenger_enabled" ' + (s.messenger_enabled !== false ? 'checked' : '') + '> Enable Messenger</div>' +
      '<label class="lbl">Messenger page ID</label><input id="s-messenger_page_id" placeholder="e.g. 123456789012345" value="' + esc(s.messenger_page_id || '').replace(/"/g, '&quot;') + '">' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Token status: ' + (s.messenger_token_set ? 'configured ✓' : 'not set — add META_PAGE_ACCESS_TOKEN on the server') + '</p>' +
      '<button onclick="saveSettings()">Save settings</button></div>' +
      '<div class="panel"><h3>AI brain (LLM)</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Optional. When set, the bot uses an OpenAI-compatible API for questions outside the knowledge base. Leave empty to run on FAQ matching only.</p>' +
      '<div class="check"><input type="checkbox" id="s-llm_enabled" ' + (s.llm_enabled !== false ? 'checked' : '') + '> Enable LLM fallback</div>' +
      '<label class="lbl">Base URL</label><input id="s-llm_base_url" placeholder="https://api.openai.com/v1" value="' + esc(s.llm_base_url || '').replace(/"/g, '&quot;') + '">' +
      '<div class="grid2"><div><label class="lbl">Model</label><input id="s-llm_model" placeholder="gpt-4o-mini" value="' + esc(s.llm_model || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div><label class="lbl">API key</label><input id="s-llm_api_key" type="password" placeholder="(stored, never shown)" value=""></div></div>' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Leave the API key blank to keep the existing one. Works with OpenAI, Azure, Ollama, vLLM, OpenRouter, Together…</p>' +
      (s.llm_encryption_on ? '' : '<p style="color:#b45309;font-size:12px;margin-bottom:12px">⚠️ ENCRYPTION_KEY is not set on the server — a new key cannot be saved securely until it is.</p>') +
      '<button onclick="saveSettings()">Save settings</button></div>' +
      '<div class="panel"><h3>Webhook secret</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Your store sends this as the <code>X-Webhook-Secret</code> header to <code>POST /api/webhook/orders</code>. Status: <strong>' + (s.webhook_secret_set ? 'set' : 'not set') + '</strong>. The secret is shown once and never again — regenerate if it leaks.</p>' +
      '<button onclick="regenWebhook()">Regenerate secret</button>' +
      '<textarea id="wh-out" rows="2" readonly style="display:none;margin-top:10px" onclick="this.select()"></textarea></div>' +
      '<div class="panel"><h3>Billing</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Manage your subscription (plan, invoices, payment method) in the Stripe customer portal. Businesses created through the pricing page have one automatically.</p>' +
      '<button onclick="openPortal()">Open billing portal</button> <span class="err" id="bill-err" style="display:none;margin-bottom:0"></span></div>' +
      '<div class="panel"><h3>Change password</h3>' +
      '<label class="lbl">Current password</label><input id="p-cur" type="password">' +
      '<label class="lbl">New password (min 8 chars)</label><input id="p-new" type="password">' +
      '<button onclick="changePw()">Change password</button> <span class="ok" id="p-ok" style="display:none">Changed ✓</span> <span class="err" id="p-err" style="display:none"></span></div>' +
      '<div class="panel"><h3>Embed snippet</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Paste this into the client\'s website (before <code>&lt;/body&gt;</code>):</p>' +
      '<textarea id="embed" rows="4" readonly onclick="this.select()"></textarea></div>';
    document.getElementById('embed').value =
      '<script src="' + window.location.origin + '/widget/widget.js"\n' +
      '        data-api-key="' + (window._apiKey || 'YOUR_API_KEY') + '"\n' +
      '        data-api-url="' + window.location.origin + '"><\/script>';
  });
}
function saveSettings() {
  function v(id) { var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; }
  var body = {
    name: v('s-name'), bot_name: v('s-bot_name'), welcome_message: v('s-welcome_message'),
    brand_color: v('s-brand_color'), support_email: v('s-support_email'),
    lead_capture_enabled: v('s-lead_capture_enabled'), allowed_origins: v('s-allowed_origins'),
    default_language: v('s-default_language'), auto_translate: v('s-auto_translate'),
    voice_enabled: v('s-voice_enabled'), llm_enabled: v('s-llm_enabled'), llm_base_url: v('s-llm_base_url'), llm_model: v('s-llm_model'),
    whatsapp_enabled: v('s-whatsapp_enabled'), whatsapp_phone_number_id: v('s-whatsapp_phone_number_id'),
    messenger_enabled: v('s-messenger_enabled'), messenger_page_id: v('s-messenger_page_id'),
  };
  var k = v('s-llm_api_key');
  if (k) body.llm_api_key = k;
  req('PUT', '/api/admin/settings', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    var ok = document.getElementById('s-ok'); ok.style.display = 'inline';
    setTimeout(function () { ok.style.display = 'none'; }, 2000);
  });
}
function regenWebhook() {
  if (!confirm('Regenerate the webhook secret? The old one stops working immediately.')) return;
  req('POST', '/api/admin/webhook/regenerate', {}).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Failed'); return; }
    var out = document.getElementById('wh-out');
    out.style.display = 'block';
    out.value = r.json.webhook_secret + '\n\n(shown once — copy it now: ' + r.json.warning + ')';
    out.select();
  });
}
function openPortal() {
  req('POST', '/api/admin/billing/portal', {}).then(function (r) {
    if (r.status >= 400) {
      var e = document.getElementById('bill-err');
      e.style.display = 'inline';
      e.textContent = r.json.error || 'Could not open the billing portal';
      return;
    }
    window.location.href = r.json.url;
  });
}
function changePw() {
  req('POST', '/api/admin/change-password', { current_password: document.getElementById('p-cur').value, new_password: document.getElementById('p-new').value })
    .then(function (r) {
      var ok = document.getElementById('p-ok'), err = document.getElementById('p-err');
      if (r.status >= 400) { err.style.display = 'inline'; err.textContent = r.json.error; ok.style.display = 'none'; return; }
      err.style.display = 'none'; ok.style.display = 'inline';
      document.getElementById('p-cur').value = ''; document.getElementById('p-new').value = '';
    });
}

/* ---------- modal ---------- */
function openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

/* ---------- boot ---------- */
req('GET', '/api/auth/me').then(function (r) {
  req('GET', '/api/admin/api-key').then(function (k) { window._apiKey = k.json.api_key; }).catch(function () {});
  showApp(r.json);
}).catch(function () { showLogin(); });
</script>
</body>
