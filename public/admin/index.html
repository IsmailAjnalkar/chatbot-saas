<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #1f2937; }
  #login { max-width: 380px; margin: 100px auto; background: #fff; padding: 36px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
  #login h1 { margin-bottom: 6px; } #login p { color: #6b7280; margin-bottom: 20px; font-size: 14px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 12px; font-family: inherit; }
  button { background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  button:hover { background: #4338ca; }
  button.ghost { background: #e5e7eb; color: #374151; }
  button.danger { background: #dc2626; }
  button.small { padding: 6px 12px; font-size: 13px; }
  #app { display: none; }
  header.app { background: #1f2937; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
  header.app .brand { font-weight: 700; font-size: 18px; }
  header.app .who { font-size: 13px; color: #9ca3af; }
  nav.tabs { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 28px; display: flex; gap: 4px; }
  nav.tabs button { background: none; color: #4b5563; border-radius: 0; padding: 14px 18px; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }
  main { padding: 28px; max-width: 1200px; margin: 0 auto; }
  .tab { display: none; } .tab.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .n { font-size: 32px; font-weight: 800; } .stat .l { color: #6b7280; font-size: 13px; margin-top: 4px; }
  .panel { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .panel h3 { margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.faq { background: #e0e7ff; color: #3730a3; } .pill.llm { background: #d1fae5; color: #065f46; }
  .pill.fallback { background: #fee2e2; color: #991b1b; } .pill.order { background: #fef3c7; color: #92400e; }
  .pill.capture { background: #ede9fe; color: #5b21b6; } .pill.smalltalk { background: #f3f4f6; color: #4b5563; }
  .pill.lead { background: #dbeafe; color: #1e40af; } .pill.callback { background: #fce7f3; color: #9d174d; }
  .row-actions { display: flex; gap: 6px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal .box { background: #fff; border-radius: 14px; padding: 28px; width: 640px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
  .transcript .u { text-align: right; margin: 8px 0; } .transcript .a { text-align: left; margin: 8px 0; }
  .transcript .u span { background: #4f46e5; color: #fff; padding: 8px 14px; border-radius: 14px; display: inline-block; max-width: 80%; }
  .transcript .a span { background: #f3f4f6; padding: 8px 14px; border-radius: 14px; display: inline-block; max-width: 80%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .err { color: #dc2626; font-size: 14px; margin-bottom: 12px; }
  .ok { color: #059669; font-size: 14px; margin-bottom: 12px; }
  label.lbl { font-size: 13px; font-weight: 600; color: #4b5563; display: block; margin-bottom: 6px; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
  .check input { width: auto; margin: 0; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="login">
  <h1>🤖 Chatbot Admin</h1>
  <p>Sign in to manage your business's chatbot.</p>
  <div class="err" id="login-err" style="display:none"></div>
  <input id="username" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()" style="width:100%">Sign in</button>
</div>

<div id="app">
  <header class="app">
    <div class="brand">🤖 <span id="biz-name">Chatbot</span> Admin</div>
    <div class="who"><span id="who"></span> &nbsp;<button class="small ghost" onclick="doLogout()">Sign out</button></div>
  </header>
  <nav class="tabs">
    <button class="active" data-tab="overview" onclick="showTab('overview')">Overview</button>
    <button data-tab="faqs" onclick="showTab('faqs')">Knowledge Base</button>
    <button data-tab="leads" onclick="showTab('leads')">Leads</button>
    <button data-tab="convs" onclick="showTab('convs')">Conversations</button>
    <button data-tab="orders" onclick="showTab('orders')">Orders</button>
    <button data-tab="settings" onclick="showTab('settings')">Settings</button>
  </nav>
  <main>
    <div class="tab active" id="tab-overview"></div>
    <div class="tab" id="tab-faqs"></div>
    <div class="tab" id="tab-leads"></div>
    <div class="tab" id="tab-convs"></div>
    <div class="tab" id="tab-orders"></div>
    <div class="tab" id="tab-settings"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
var API = '';
function req(method, url, body) {
  return fetch(API + url, {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  }).then(function (r) {
    if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
    return r.json().then(function (j) { return { status: r.status, json: j }; });
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function timeAgo(ts) { var d = new Date(ts); return d.toLocaleString(); }

function showLogin() { document.getElementById('login').style.display = 'block'; document.getElementById('app').style.display = 'none'; }
function showApp(me) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('who').textContent = me.username + ' · ' + me.business.name;
  document.getElementById('biz-name').textContent = me.business.name;
  loadOverview();
}

function doLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  req('POST', '/api/auth/login', { username: u, password: p }).then(function (r) {
    if (r.status !== 200) { var e = document.getElementById('login-err'); e.style.display = 'block'; e.textContent = r.json.error || 'Login failed'; return; }
    req('GET', '/api/auth/me').then(function (m) { showApp(m.json); });
  }).catch(function () {});
}
function doLogout() { req('POST', '/api/auth/logout').then(showLogin); }
document.getElementById('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

function showTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  ({ overview: loadOverview, faqs: loadFaqs, leads: loadLeads, convs: loadConvs, orders: loadOrders, settings: loadSettings })[name]();
}

/* ---------- Overview ---------- */
function loadOverview() {
  req('GET', '/api/admin/analytics').then(function (r) {
    var a = r.json;
    var maxChats = Math.max.apply(null, [1].concat(a.chats_per_day.map(function (d) { return d.chats; })));
    var bars = a.chats_per_day.map(function (d) {
      return '<div style="flex:1;text-align:center"><div style="height:' + Math.round(d.chats / maxChats * 120) + 'px;background:#4f46e5;border-radius:4px 4px 0 0"></div><div style="font-size:11px;color:#6b7280;margin-top:4px">' + esc(d.day.slice(5)) + '<br><strong>' + d.chats + '</strong></div></div>';
    }).join('');
    var unans = a.top_unanswered.length ? a.top_unanswered.map(function (u) {
      return '<tr><td>' + esc(u.question) + '</td><td>' + u.times + '×</td><td style="color:#6b7280">' + timeAgo(u.last_seen) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" style="color:#6b7280">No unanswered questions — nice!</td></tr>';
    document.getElementById('tab-overview').innerHTML =
      '<div class="cards">' +
      '<div class="stat"><div class="n">' + a.resolution.total + '</div><div class="l">Chats (30 days)</div></div>' +
      '<div class="stat"><div class="n">' + a.resolution.resolution_rate + '%</div><div class="l">Est. resolution rate</div></div>' +
      '<div class="stat"><div class="n">' + a.leads_30d + '</div><div class="l">Leads captured (30 days)</div></div>' +
      '<div class="stat"><div class="n">' + a.top_unanswered.length + '</div><div class="l">Distinct unanswered topics</div></div>' +
      '</div>' +
      '<div class="panel"><h3>Chats per day (14 days)</h3><div style="display:flex;gap:6px;align-items:flex-end">' + bars + '</div></div>' +
      '<div class="panel"><h3>Top unanswered questions</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Questions the bot couldn\'t answer — add these to the Knowledge Base to improve it.</p><table><tr><th>Question</th><th>Times asked</th><th>Last seen</th></tr>' + unans + '</table></div>';
  });
}

/* ---------- FAQs ---------- */
function loadFaqs() {
  req('GET', '/api/admin/faqs').then(function (r) {
    var rows = r.json.map(function (f) {
      return '<tr><td><strong>' + esc(f.question) + '</strong><br><span style="color:#4b5563">' + esc(f.answer).slice(0, 120) + (f.answer.length > 120 ? '…' : '') + '</span><br><span style="color:#9ca3af;font-size:12px">keywords: ' + esc(f.keywords) + '</span></td>' +
        '<td><div class="row-actions"><button class="small ghost" onclick="editFaq(' + f.id + ')">Edit</button><button class="small danger" onclick="delFaq(' + f.id + ')">Delete</button></div></td></tr>';
    }).join('');
    document.getElementById('tab-faqs').innerHTML =
      '<div class="panel"><h3>Knowledge base <span style="color:#6b7280;font-weight:400;font-size:13px">(' + r.json.length + ' entries)</span></h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">The bot matches visitor questions against these using TF-IDF similarity. Add keywords (comma-separated synonyms) to improve matching.</p>' +
      '<button onclick="editFaq(null)">+ Add FAQ</button></div>' +
      '<div class="panel"><table><tr><th>Question / Answer</th><th style="width:150px">Actions</th></tr>' + (rows || '<tr><td colspan="2" style="color:#6b7280">No FAQs yet — add your first one above.</td></tr>') + '</table></div>';
    window._faqs = r.json;
  });
}
function editFaq(id) {
  var f = id ? window._faqs.find(function (x) { return x.id === id; }) : { question: '', answer: '', keywords: '' };
  openModal('<h3>' + (id ? 'Edit' : 'Add') + ' FAQ</h3>' +
    '<label class="lbl">Question</label><input id="f-q" value="' + esc(f.question).replace(/"/g, '&quot;') + '">' +
    '<label class="lbl">Answer</label><textarea id="f-a" rows="5">' + esc(f.answer) + '</textarea>' +
    '<label class="lbl">Keywords (optional, comma-separated)</label><input id="f-k" value="' + esc(f.keywords).replace(/"/g, '&quot;') + '">' +
    '<div class="row-actions"><button onclick="saveFaq(' + (id || 'null') + ')">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div><div class="ok" id="f-ok" style="display:none;margin-top:12px"></div>');
}
function saveFaq(id) {
  var body = { question: document.getElementById('f-q').value.trim(), answer: document.getElementById('f-a').value.trim(), keywords: document.getElementById('f-k').value.trim() };
  if (!body.question || !body.answer) { alert('Question and answer are required.'); return; }
  req(id ? 'PUT' : 'POST', id ? '/api/admin/faqs/' + id : '/api/admin/faqs', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    closeModal(); loadFaqs();
  });
}
function delFaq(id) {
  if (!confirm('Delete this FAQ?')) return;
  req('DELETE', '/api/admin/faqs/' + id).then(loadFaqs);
}

/* ---------- Leads ---------- */
function loadLeads() {
  req('GET', '/api/admin/leads').then(function (r) {
    var rows = r.json.map(function (l) {
      return '<tr><td><strong>' + esc(l.name) + '</strong></td><td>' + esc(l.email) + '<br><span style="color:#6b7280">' + esc(l.phone) + '</span></td>' +
        '<td><span class="pill ' + esc(l.kind) + '">' + esc(l.kind) + '</span></td><td style="color:#4b5563">' + esc(l.note).slice(0, 90) + '</td><td style="color:#6b7280;white-space:nowrap">' + timeAgo(l.created_at) + '</td>' +
        (l.session_id ? '<td><button class="small ghost" onclick="viewSession(\'' + l.session_id + '\')">Transcript</button></td>' : '<td></td>') + '</tr>';
    }).join('');
    document.getElementById('tab-leads').innerHTML =
      '<div class="panel"><h3>Leads <span style="color:#6b7280;font-weight:400;font-size:13px">(' + r.json.length + ')</span></h3>' +
      '<button class="ghost" onclick="window.location=\'/api/admin/leads?format=csv\'">⬇ Export CSV</button></div>' +
      '<div class="panel"><table><tr><th>Name</th><th>Contact</th><th>Type</th><th>Note</th><th>Captured</th><th></th></tr>' + (rows || '<tr><td colspan="6" style="color:#6b7280">No leads yet. When the bot can\'t answer or a visitor asks for a human, their details land here.</td></tr>') + '</table></div>';
  });
}

/* ---------- Conversations ---------- */
function loadConvs() {
  req('GET', '/api/admin/sessions?flagged=1').then(function (fr) {
    req('GET', '/api/admin/sessions').then(function (r) {
      function row(s) {
        return '<tr><td style="font-family:monospace;font-size:12px">' + esc(s.id.slice(0, 14)) + '…</td>' +
          '<td style="color:#6b7280;white-space:nowrap">' + timeAgo(s.created_at) + '</td>' +
          '<td>' + (s.flagged_human ? '<span class="pill fallback">needs human</span>' : s.resolved ? '<span class="pill llm">resolved</span>' : '<span class="pill smalltalk">open</span>') + '</td>' +
          '<td><div class="row-actions"><button class="small ghost" onclick="viewSession(\'' + s.id + '\')">View</button>' +
          (s.flagged_human ? '<button class="small" onclick="resolveSession(\'' + s.id + '\')">Mark resolved</button>' : '') + '</div></td></tr>';
      }
      var flagged = fr.json.map(row).join('');
      var all = r.json.map(row).join('');
      document.getElementById('tab-convs').innerHTML =
        '<div class="panel"><h3>⚑ Needs human follow-up (' + fr.json.length + ')</h3><table><tr><th>Session</th><th>Started</th><th>Status</th><th></th></tr>' + (flagged || '<tr><td colspan="4" style="color:#6b7280">Nothing flagged. Visitors who ask for a human appear here.</td></tr>') + '</table></div>' +
        '<div class="panel"><h3>All conversations (' + r.json.length + ')</h3><table><tr><th>Session</th><th>Started</th><th>Status</th><th></th></tr>' + (all || '<tr><td colspan="4" style="color:#6b7280">No conversations yet.</td></tr>') + '</table></div>';
    });
  });
}
function viewSession(id) {
  req('GET', '/api/admin/sessions/' + id).then(function (r) {
    var msgs = r.json.messages.map(function (m) {
      var meta = {};
      try { meta = JSON.parse(m.meta || '{}'); } catch (e) {}
      var cls = m.role === 'user' ? 'u' : 'a';
      var tag = m.role === 'assistant' && meta.type ? ' <span class="pill ' + esc(meta.type) + '">' + esc(meta.type) + (meta.confidence ? ' ' + meta.confidence : '') + '</span>' : '';
      return '<div class="' + cls + '"><span>' + esc(m.text) + '</span>' + tag + '</div>';
    }).join('');
    openModal('<h3>Conversation</h3><div class="transcript">' + msgs + '</div><div class="row-actions" style="margin-top:16px"><button class="ghost" onclick="closeModal()">Close</button></div>');
  });
}
function resolveSession(id) {
  req('POST', '/api/admin/sessions/' + id + '/resolve').then(loadConvs);
}

/* ---------- Orders ---------- */
function loadOrders() {
  req('GET', '/api/admin/orders').then(function (r) {
    var rows = r.json.map(function (o) {
      return '<tr><td><strong>' + esc(o.order_number) + '</strong></td><td>' + esc(o.status) + '</td><td>' + esc(o.eta) + '</td><td>' + esc(o.carrier) + ' ' + esc(o.tracking_number) + '</td><td style="color:#6b7280">' + esc(o.items) + '</td>' +
        '<td><button class="small danger" onclick="delOrder(' + o.id + ')">Delete</button></td></tr>';
    }).join('');
    document.getElementById('tab-orders').innerHTML =
      '<div class="panel"><h3>Mock order store</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Used for demo tracking. In production, connect your store via the webhook: <code>POST /api/webhook/orders</code> with <code>{"api_key":"…","orders":[{order_number, status, eta, carrier, tracking_number, items}]}</code>.</p>' +
      '<button onclick="editOrder(null)">+ Add order</button></div>' +
      '<div class="panel"><table><tr><th>Order #</th><th>Status</th><th>ETA</th><th>Carrier / Tracking</th><th>Items</th><th></th></tr>' + (rows || '<tr><td colspan="6" style="color:#6b7280">No orders.</td></tr>') + '</table></div>';
    window._orders = r.json;
  });
}
function editOrder(id) {
  var o = id ? window._orders.find(function (x) { return x.id === id; }) : { order_number: '', status: '', eta: '', carrier: '', tracking_number: '', items: '' };
  openModal('<h3>' + (id ? 'Edit' : 'Add') + ' order</h3>' +
    ['order_number|Order number', 'status|Status', 'eta|ETA', 'carrier|Carrier', 'tracking_number|Tracking number', 'items|Items'].map(function (f) {
      var k = f.split('|')[0], l = f.split('|')[1];
      return '<label class="lbl">' + l + '</label><input id="o-' + k + '" value="' + esc(o[k]).replace(/"/g, '&quot;') + '">';
    }).join('') +
    '<div class="row-actions"><button onclick="saveOrder()">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div>');
}
function saveOrder() {
  var body = {};
  ['order_number', 'status', 'eta', 'carrier', 'tracking_number', 'items'].forEach(function (k) { body[k] = document.getElementById('o-' + k).value.trim(); });
  if (!body.order_number || !body.status) { alert('Order number and status are required.'); return; }
  req('POST', '/api/admin/orders', body).then(function () { closeModal(); loadOrders(); });
}
function delOrder(id) { if (confirm('Delete this order?')) req('DELETE', '/api/admin/orders/' + id).then(loadOrders); }

/* ---------- Settings ---------- */
function loadSettings() {
  req('GET', '/api/admin/settings').then(function (r) {
    var s = r.json;
    document.getElementById('tab-settings').innerHTML =
      '<div class="panel"><h3>Business &amp; widget</h3>' +
      '<label class="lbl">Business name</label><input id="s-name" value="' + esc(s.name).replace(/"/g, '&quot;') + '">' +
      '<label class="lbl">Bot display name</label><input id="s-bot_name" value="' + esc(s.bot_name || '').replace(/"/g, '&quot;') + '">' +
      '<label class="lbl">Welcome message</label><textarea id="s-welcome_message" rows="3">' + esc(s.welcome_message || '') + '</textarea>' +
      '<div class="grid2"><div><label class="lbl">Brand color</label><input id="s-brand_color" value="' + esc(s.brand_color || '#4f46e5') + '"></div>' +
      '<div><label class="lbl">Support email</label><input id="s-support_email" value="' + esc(s.support_email || '').replace(/"/g, '&quot;') + '"></div></div>' +
      '<div class="check"><input type="checkbox" id="s-lead_capture_enabled" ' + (s.lead_capture_enabled !== false ? 'checked' : '') + '> Enable automatic lead capture when the bot can\'t answer</div>' +
      '<label class="lbl">Allowed origins (widget security)</label><textarea id="s-allowed_origins" rows="2" placeholder="https://shop.example.com, https://www.example.com">' + esc(s.allowed_origins || '') + '</textarea>' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Domains allowed to load the widget (comma or line separated). Supports <code>https://*.example.com</code>. Leave empty only for development.</p>' +
      '<button onclick="saveSettings()">Save settings</button> <span class="ok" id="s-ok" style="display:none">Saved ✓</span></div>' +
      '<div class="panel"><h3>AI brain (LLM)</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Optional. When set, the bot uses an OpenAI-compatible API for questions outside the knowledge base. Leave empty to run on FAQ matching only.</p>' +
      '<div class="check"><input type="checkbox" id="s-llm_enabled" ' + (s.llm_enabled !== false ? 'checked' : '') + '> Enable LLM fallback</div>' +
      '<label class="lbl">Base URL</label><input id="s-llm_base_url" placeholder="https://api.openai.com/v1" value="' + esc(s.llm_base_url || '').replace(/"/g, '&quot;') + '">' +
      '<div class="grid2"><div><label class="lbl">Model</label><input id="s-llm_model" placeholder="gpt-4o-mini" value="' + esc(s.llm_model || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div><label class="lbl">API key</label><input id="s-llm_api_key" type="password" placeholder="(stored, never shown)" value=""></div></div>' +
      '<p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Leave the API key blank to keep the existing one. Works with OpenAI, Azure, Ollama, vLLM, OpenRouter, Together…</p>' +
      (s.llm_encryption_on ? '' : '<p style="color:#b45309;font-size:12px;margin-bottom:12px">⚠️ ENCRYPTION_KEY is not set on the server — a new key cannot be saved securely until it is.</p>') +
      '<button onclick="saveSettings()">Save settings</button></div>' +
      '<div class="panel"><h3>Webhook secret</h3>' +
      '<p style="color:#6b7280;font-size:13px;margin-bottom:12px">Your store sends this as the <code>X-Webhook-Secret</code> header to <code>POST /api/webhook/orders</code>. Status: <strong>' + (s.webhook_secret_set ? 'set' : 'not set') + '</strong>. The secret is shown once and never again — regenerate if it leaks.</p>' +
      '<button onclick="regenWebhook()">Regenerate secret</button>' +
      '<textarea id="wh-out" rows="2" readonly style="display:none;margin-top:10px" onclick="this.select()"></textarea></div>' +
      '<div class="panel"><h3>Change password</h3>' +
      '<label class="lbl">Current password</label><input id="p-cur" type="password">' +
      '<label class="lbl">New password (min 8 chars)</label><input id="p-new" type="password">' +
      '<button onclick="changePw()">Change password</button> <span class="ok" id="p-ok" style="display:none">Changed ✓</span> <span class="err" id="p-err" style="display:none"></span></div>' +
      '<div class="panel"><h3>Embed snippet</h3><p style="color:#6b7280;font-size:13px;margin-bottom:12px">Paste this into the client\'s website (before <code>&lt;/body&gt;</code>):</p>' +
      '<textarea id="embed" rows="4" readonly onclick="this.select()"></textarea></div>';
    document.getElementById('embed').value =
      '<script src="' + window.location.origin + '/widget/widget.js"\n' +
      '        data-api-key="' + (window._apiKey || 'YOUR_API_KEY') + '"\n' +
      '        data-api-url="' + window.location.origin + '"><\/script>';
  });
}
function saveSettings() {
  function v(id) { var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; }
  var body = {
    name: v('s-name'), bot_name: v('s-bot_name'), welcome_message: v('s-welcome_message'),
    brand_color: v('s-brand_color'), support_email: v('s-support_email'),
    lead_capture_enabled: v('s-lead_capture_enabled'), allowed_origins: v('s-allowed_origins'),
    llm_enabled: v('s-llm_enabled'), llm_base_url: v('s-llm_base_url'), llm_model: v('s-llm_model'),
  };
  var k = v('s-llm_api_key');
  if (k) body.llm_api_key = k;
  req('PUT', '/api/admin/settings', body).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Save failed'); return; }
    var ok = document.getElementById('s-ok'); ok.style.display = 'inline';
    setTimeout(function () { ok.style.display = 'none'; }, 2000);
  });
}
function regenWebhook() {
  if (!confirm('Regenerate the webhook secret? The old one stops working immediately.')) return;
  req('POST', '/api/admin/webhook/regenerate', {}).then(function (r) {
    if (r.status >= 400) { alert(r.json.error || 'Failed'); return; }
    var out = document.getElementById('wh-out');
    out.style.display = 'block';
    out.value = r.json.webhook_secret + '\n\n(shown once — copy it now: ' + r.json.warning + ')';
    out.select();
  });
}
function changePw() {
  req('POST', '/api/admin/change-password', { current_password: document.getElementById('p-cur').value, new_password: document.getElementById('p-new').value })
    .then(function (r) {
      var ok = document.getElementById('p-ok'), err = document.getElementById('p-err');
      if (r.status >= 400) { err.style.display = 'inline'; err.textContent = r.json.error; ok.style.display = 'none'; return; }
      err.style.display = 'none'; ok.style.display = 'inline';
      document.getElementById('p-cur').value = ''; document.getElementById('p-new').value = '';
    });
}

/* ---------- modal ---------- */
function openModal(html) { document.getElementById('modal-box').innerHTML = html; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

/* ---------- boot ---------- */
req('GET', '/api/auth/me').then(function (r) {
  req('GET', '/api/admin/api-key').then(function (k) { window._apiKey = k.json.api_key; }).catch(function () {});
  showApp(r.json);
}).catch(function () { showLogin(); });
</script>
